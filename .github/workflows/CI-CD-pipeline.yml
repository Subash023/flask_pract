name: CI/CD Build and Deploy

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1                    # Change to your AWS region
  ECR_REPOSITORY: flask-student-app        # Change to your ECR repo name
  EC2_PORT: 5000
  FAILED_STAGE: "None"

jobs:
  pipeline:
    runs-on: ubuntu-latest

     # Add a MongoDB service container
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
          
    steps:
    # STEP 1: Repository Checkout (Upgraded to resolve Node 20 deprecation)
    - name: Checkout Code
      uses: actions/checkout@v4

    # STEP 2: Install Dependencies & Setup Runtime (Consolidated & Upgraded to v5)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    # STEP 3: Test Execution
    - name: Run Unit Tests
      id: test_stage
      run: |
        pytest test_app.py

    - name: Set Failure Stage (Test)
      if: failure() && steps.test_stage.outcome == 'failure'
      run: echo "FAILED_STAGE=test" >> $GITHUB_ENV

    # STEP 4 & 5: Authenticate AWS, Build & Push Tagged Image
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker Image
      id: build_stage
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
        docker tag ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

    - name: Set Failure Stage (Build)
      if: failure() && steps.build_stage.outcome == 'failure'
      run: echo "FAILED_STAGE=build" >> $GITHUB_ENV

    - name: Push to ECR
      id: push_stage
      run: |
        docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

    - name: Set Failure Stage (Push)
      if: failure() && steps.push_stage.outcome == 'failure'
      run: echo "FAILED_STAGE=push" >> $GITHUB_ENV

  Depoly:
    runs-on: ubuntu-latest   
    steps:
      - name: Deploy and Verify Health via SSH
        uses: appleboy/ssh-action@master
        with:
           host: ${{ secrets.EC2_HOST }}
           username: ${{ secrets.EC2_USERNAME }}
           key: ${{ secrets.EC2_SSH_KEY }}
           script: |
            # 1. Pull the latest image
            docker pull ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            
            # 2. Stop and remove old container
            docker stop test-student-app || true
            docker rm test-student-app || true
            
            # 3. Run the new container
            docker run -d \
              --name test-student-app \
              -p 5000:5000 \
              --restart unless-stopped \
              ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

            # 4. Pipeline Verification Loop
            echo "Waiting for application to pass health check..."
            
            TIMEOUT=60
            ELAPSED=0
            STATUS_URL="http://localhost:5000/health"
            
            while [ $ELAPSED -lt $TIMEOUT ]; do
              # Get the HTTP status code directly
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $STATUS_URL || true)
              
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "SUCCESS: Health endpoint returned HTTP 200 OK!"
                exit 0
              fi
              
              echo "Application status is $HTTP_STATUS. Retrying in 5 seconds..."
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            # 5. Rollback or Fail Actions if Unhealthy
            echo "ERROR: Health check timed out after $TIMEOUT seconds."
            echo "Printing container logs for debugging:"
            docker logs test-student-app
            exit 1

      - name: Set Failure Stage (Deploy)
        if: failure() && steps.deploy_stage.outcome == 'failure'
        run: echo "FAILED_STAGE=deploy" >> $GITHUB_ENV

      - name: Notify Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "🚀 SUCCESS: Deployment completed for ${{ github.repository }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: CI/CD Pipeline <noreply@github.com>
          body: |
            Deployment completed successfully!
          
          • Branch: ${{ github.ref_name }}
          • Commit SHA: ${{ github.sha }}
          • Docker Tag: ${{ github.sha }}
          • Target Host: ${{ secrets.EC2_HOST }}
          • Pipeline Run Link: https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "❌ FAILURE: Pipeline Failed for ${{ github.repository }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: CI/CD Pipeline <noreply@github.com>
          body: |
            The pipeline execution failed.
          
          • Failed Stage: ${{ env.FAILED_STAGE }}
          • Branch: ${{ github.ref_name }}
          • Commit SHA: ${{ github.sha }}
          • Review Logs Immediately: https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}
